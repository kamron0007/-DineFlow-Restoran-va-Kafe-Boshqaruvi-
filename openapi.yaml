openapi: 3.0.3
info:
  title: DineFlow Restaurant REST API
  version: 1.0.0
  description: >
    DineFlow — Restoran va kafe boshqaruv tizimi uchun Menyu, Kategoriyalar va
    Buyurtmalar REST API spetsifikatsiyasi (Supabase + In-Memory Gibrid Backend).
  contact:
    name: DineFlow Engineering
    email: boymurodovkamronbek474@gmail.com
servers:
  - url: http://localhost:3000
    description: Lokal VS Code Development Server
paths:
  /api/health:
    get:
      tags:
        - System
      summary: Server va ma'lumotlar bazasi holatini tekshirish
      responses:
        '200':
          description: Server faol holatda
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  mode:
                    type: string
                    enum: [supabase, memory]
                    example: memory
                  timestamp:
                    type: string
                    format: date-time

  /api/categories:
    get:
      tags:
        - Menu
      summary: Barcha menyu kategoriyalarini olish
      responses:
        '200':
          description: Kategoriyalar ro'yxati
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

  /api/menu:
    get:
      tags:
        - Menu
      summary: Taomlar ro'yxatini olish (filtrlar bilan)
      parameters:
        - name: category_id
          in: query
          required: false
          description: Kategoriya ID bo'yicha filtrlash (masalan, cat-1)
          schema:
            type: string
        - name: tier
          in: query
          required: false
          description: Taom darajasi bo'yicha filtrlash
          schema:
            type: string
            enum: [oddiy, biznes, vip]
        - name: available
          in: query
          required: false
          description: Faqat mavjud taomlarni olish (true/false)
          schema:
            type: boolean
      responses:
        '200':
          description: Menyudagi taomlar ro'yxati
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'
    post:
      tags:
        - Menu
      summary: Menyuga yangi taom qo'shish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMenuItemInput'
      responses:
        '201':
          description: Yangi taom muvaffaqiyatli yaratildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '400':
          description: Noto'g'ri so'rov ma'lumotlari

  /api/menu/{id}:
    get:
      tags:
        - Menu
      summary: ID bo'yicha bitta taom ma'lumotini olish
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Taom ma'lumotlari
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '404':
          description: Taom topilmadi
    put:
      tags:
        - Menu
      summary: Taom ma'lumotlarini yoki narxini yangilash
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMenuItemInput'
      responses:
        '200':
          description: Taom yangilandi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '404':
          description: Taom topilmadi
    delete:
      tags:
        - Menu
      summary: Taomni menyudan o'chirish
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Taom muvaffaqiyatli o'chirildi

  /api/orders:
    get:
      tags:
        - Orders
      summary: Buyurtmalar ro'yxatini olish
      parameters:
        - name: status
          in: query
          required: false
          description: Buyurtma holati bo'yicha filtrlash
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: table_number
          in: query
          required: false
          description: Stol raqami bo'yicha filtrlash
          schema:
            type: integer
      responses:
        '200':
          description: Buyurtmalar ro'yxati
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      tags:
        - Orders
      summary: Yangi buyurtma yaratish (Mijoz yoki Ofitsiant tomonidan)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderInput'
      responses:
        '201':
          description: Buyurtma qabul qilindi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Stol raqami yoki taomlar ro'yxati kiritilmagan

  /api/orders/{id}:
    get:
      tags:
        - Orders
      summary: Buyurtma tafsilotlarini ID orqali olish
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Buyurtma ma'lumoti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Buyurtma topilmadi

  /api/orders/{id}/status:
    patch:
      tags:
        - Orders
      summary: Buyurtma holatini o'zgartirish (KDS / Ofitsiant)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Buyurtma statusi yangilandi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Noto'g'ri status qiymati
        '404':
          description: Buyurtma topilmadi

components:
  schemas:
    Category:
      type: object
      required: [id, name, sort_order, created_at]
      properties:
        id:
          type: string
          example: cat-1
        name:
          type: string
          example: Milliy taomlar
        icon:
          type: string
          example: Utensils
        sort_order:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time

    MenuItem:
      type: object
      required: [id, category_id, name, description, price, is_available, created_at]
      properties:
        id:
          type: string
          example: dish-1
        category_id:
          type: string
          example: cat-1
        name:
          type: string
          example: Toshkent To'y Oshi
        description:
          type: string
          example: Lazar guruchidan tayyorlangan, qazi, bedana tuxumi va no'xatli an'anaviy palov.
        price:
          type: number
          example: 48000
        image_url:
          type: string
          example: /images/dishes/dish-1.jpg
        is_available:
          type: boolean
          example: true
        prep_time_minutes:
          type: integer
          example: 15
        calories:
          type: integer
          example: 680
        tier:
          type: string
          enum: [oddiy, biznes, vip]
          example: biznes
        created_at:
          type: string
          format: date-time

    CreateMenuItemInput:
      type: object
      required: [category_id, name, price]
      properties:
        category_id:
          type: string
          example: cat-1
        name:
          type: string
          example: Xorazm Tuxum Barak
        description:
          type: string
          example: Yangi xamir va tuxum-sutli solmadan tayyorlangan milliy taom
        price:
          type: number
          example: 42000
        image_url:
          type: string
          example: /images/dishes/dish-1.jpg
        is_available:
          type: boolean
          default: true
        prep_time_minutes:
          type: integer
          example: 18
        calories:
          type: integer
          example: 540
        tier:
          type: string
          enum: [oddiy, biznes, vip]
          default: oddiy

    UpdateMenuItemInput:
      type: object
      properties:
        category_id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        image_url:
          type: string
        is_available:
          type: boolean
        prep_time_minutes:
          type: integer
        tier:
          type: string
          enum: [oddiy, biznes, vip]

    OrderStatus:
      type: string
      enum: [new, preparing, ready, delivered, cancelled]
      example: preparing

    OrderItem:
      type: object
      required: [id, order_id, menu_item_id, item_name, unit_price, quantity, line_total]
      properties:
        id:
          type: string
          example: item-101
        order_id:
          type: string
          example: ord-1
        menu_item_id:
          type: string
          example: dish-1
        item_name:
          type: string
          example: Toshkent To'y Oshi
        unit_price:
          type: number
          example: 48000
        quantity:
          type: integer
          example: 2
        item_note:
          type: string
          example: Piyozsiz bo'lsin
        line_total:
          type: number
          example: 96000

    Order:
      type: object
      required: [id, order_number, table_id, table_number, status, total_amount, items, created_at, updated_at]
      properties:
        id:
          type: string
          example: ord-1082
        order_number:
          type: string
          example: '#DF-1082'
        table_id:
          type: string
          example: tbl-5
        table_number:
          type: integer
          example: 5
        status:
          $ref: '#/components/schemas/OrderStatus'
        total_amount:
          type: number
          example: 132000
        customer_note:
          type: string
          example: Ko'k choy limon bilan avval keltirilsin
        waiter_name:
          type: string
          example: Karimov Dilshod Baxtiyorovich
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateOrderInput:
      type: object
      required: [table_number, items]
      properties:
        table_number:
          type: integer
          example: 5
        customer_note:
          type: string
          example: Achchiq bo'lmasin
        waiter_name:
          type: string
          example: Karimov Dilshod Baxtiyorovich
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [menu_item_id, quantity]
            properties:
              menu_item_id:
                type: string
                example: dish-1
              quantity:
                type: integer
                minimum: 1
                example: 2
              item_note:
                type: string
                example: Qazisi ko'proq
